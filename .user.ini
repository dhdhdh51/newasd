; School ERP — PHP settings for cPanel FastCGI / PHP-FPM
; This file is read by PHP-FPM and CGI modes (unlike php_flag in .htaccess)

display_errors = Off
log_errors = On
upload_max_filesize = 5M
post_max_size = 6M
max_execution_time = 60
memory_limit = 128M
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = "Lax"
